name: Release

# Publishing runs here rather than from a laptop because n8n's verification
# scan (`npx @n8n/scan-community-package`) requires an npm provenance
# attestation, and npm only issues one for a publish from a trusted CI runner
# with an OIDC token. The scan then fetches the attested commit from this
# public repository and lints it, so the tag must exist here too.
#
# Authentication is npm "trusted publishing": the package's settings on
# npmjs.com name this repository and this workflow file as a trusted
# publisher, and npm (11.5.1 or newer) exchanges the job's OIDC token for a
# short-lived publish credential. No npm token is stored in the repository.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish (for example v0.1.0)'
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # Required for the OIDC token that npm exchanges for publish rights and
      # uses to mint the provenance attestation.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          # >=20.15 per package.json engines.
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm 11.5.1 or newer; Node 22 ships an older npm.
      - run: npm install -g npm@latest

      - run: npm ci

      # prepublishOnly repeats these, but running them as their own steps makes
      # a failure readable in the job log instead of buried in the publish step.
      - run: npm run lint
      - run: npm test

      - run: npm publish --provenance --access public
